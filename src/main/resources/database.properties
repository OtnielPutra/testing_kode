# ============================================================
#  Konfigurasi koneksi database PRISMA TV
#  Sesuaikan port / user / password dengan MySQL Anda.
#  (Dump SQL dibuat di localhost:3308, database: prisma_tv)
# ============================================================
db.url=jdbc:mysql://localhost:3306/prisma_tv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# ---- Connection Pool (HikariCP) ----
db.pool.name=PrismaTVPool
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=10000
db.pool.idleTimeoutMs=300000
